<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能数据分析系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-gray: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-gray);
            color: var(--text-primary);
            min-height: 100vh;
        }
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 50%, #7c3aed 100%);
            color: white;
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-logo {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .status-badge {
            background: rgba(255,255,255,0.15);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Container */
        .container { display: flex; min-height: calc(100vh - 64px); }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            position: sticky;
            top: 64px;
            height: calc(100vh - 64px);
            overflow-y: auto;
        }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding: 0 12px;
        }
        .sidebar ul { list-style: none; }
        .sidebar li { margin-bottom: 4px; }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .sidebar a:hover {
            background: var(--bg-gray);
            color: var(--text-primary);
        }
        .sidebar a.active {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .sidebar-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

        /* Main Content */
        .main { flex: 1; padding: 32px; overflow-y: auto; }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: box-shadow 0.3s;
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 .icon { font-size: 20px; }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }
        .btn-secondary {
            background: var(--bg-gray);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--border); }
        .btn-danger {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            color: white;
        }
        .btn-danger:hover { transform: translateY(-1px); }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

        /* Inputs */
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            background: var(--bg-card);
        }
        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .input-group textarea { resize: vertical; min-height: 100px; }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--bg-gray);
        }
        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }
        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.01);
        }
        .upload-icon { font-size: 48px; margin-bottom: 16px; }
        .upload-text { color: var(--text-secondary); font-size: 14px; }
        .upload-hint { color: var(--text-secondary); font-size: 12px; margin-top: 8px; }

        /* Tables */
        .table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
        .table th {
            background: var(--bg-gray);
            font-weight: 600;
            color: var(--text-secondary);
            padding: 14px 16px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .table th:first-child { border-radius: 10px 0 0 10px; }
        .table th:last-child { border-radius: 0 10px 10px 0; }
        .table td { padding: 16px; border-bottom: 1px solid var(--border); }
        .table tr:hover td { background: var(--bg-gray); }
        .table tr:last-child td { border-bottom: none; }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-success { background: #d1fae5; color: #059669; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        .badge-error { background: #fee2e2; color: #dc2626; }
        .badge-info { background: #dbeafe; color: #2563eb; }

        /* Loading */
        .loading {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Messages */
        .message-list { max-height: 500px; overflow-y: auto; }
        .message { margin-bottom: 16px; display: flex; }
        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }
        .message-content {
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 75%;
            line-height: 1.6;
            font-size: 14px;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .message-content {
            background: var(--bg-gray);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        /* Anomaly Items */
        .anomaly-item {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid var(--danger);
            background: #fef2f2;
        }
        .anomaly-item.medium { border-left-color: var(--warning); background: #fffbeb; }
        .anomaly-item.low { border-left-color: #3b82f6; background: #eff6ff; }
        .anomaly-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .anomaly-title { font-weight: 600; font-size: 14px; }
        .anomaly-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        .anomaly-advice { font-size: 12px; color: var(--text-secondary); background: rgba(255,255,255,0.5); padding: 8px 12px; border-radius: 8px; }

        /* Statistics Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
        .stat-item { background: var(--bg-gray); padding: 16px; border-radius: 12px; text-align: center; }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 32px;
            width: 95%;
            max-width: 1000px;
            max-height: 85vh;
            overflow: auto;
            box-shadow: var(--shadow-lg);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--bg-gray); cursor: pointer; font-size: 18px; transition: all 0.2s; }
        .modal-close:hover { background: var(--border); }

        /* Report Content */
        .report-content { white-space: pre-wrap; font-family: inherit; line-height: 1.8; color: var(--text-primary); }

        /* Summary Box */
        .summary-box {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(124, 58, 237, 0.1) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        /* Quick Actions */
        .quick-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .quick-btn {
            padding: 12px 20px;
            background: var(--bg-gray);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .quick-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Tabs */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Section Headers */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 24px 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
        }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--secondary); }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-logo">📊</div>
            <h1>AI智能数据分析系统</h1>
        </div>
        <div class="header-right">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>系统就绪</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">主菜单</div>
                <ul>
                    <li><a href="#data" class="active" onclick="showTab('data')">
                        <span class="sidebar-icon">📁</span>数据管理
                    </a></li>
                    <li><a href="#analysis" onclick="showTab('analysis')">
                        <span class="sidebar-icon">🔍</span>问答分析
                    </a></li>
                    <li><a href="#reports" onclick="showTab('reports')">
                        <span class="sidebar-icon">📝</span>报告中心
                    </a></li>
                    <li><a href="#logs" onclick="showTab('logs')">
                        <span class="sidebar-icon">📋</span>执行日志
                    </a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">快捷操作</div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="showTab('analysis')">发起分析</button>
                    <button class="quick-btn" onclick="showTab('data')">上传数据</button>
                </div>
            </div>
        </div>

        <div class="main">
            <!-- Data Tab -->
            <div id="data-tab" class="tab-content active">
                <div class="card">
                    <div class="card-header">
                        <h2><span class="icon">📤</span>上传数据文件</h2>
                    </div>
                    <div class="upload-area" id="upload-area" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" onclick="document.getElementById('file-input').click()">
                        <input type="file" id="file-input" accept=".csv,.xlsx" style="display:none" onchange="handleFileSelect(event)">
                        <div class="upload-icon">☁️</div>
                        <div class="upload-text">点击或拖拽上传 Excel/CSV 文件</div>
                        <div class="upload-hint">支持 .xlsx, .csv 格式</div>
                    </div>
                    <div id="upload-result" style="margin-top:16px"></div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2><span class="icon">📋</span>数据源列表</h2>
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>文件</th>
                                <th>字段数</th>
                                <th>行数</th>
                                <th>大小</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="data-sources-body">
                            <tr><td colspan="6" class="empty-state"><div class="empty-icon">📭</div>暂无数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Analysis Tab -->
            <div id="analysis-tab" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h2><span class="icon">🤖</span>智能问答分析</h2>
                    </div>
                    <div class="input-group">
                        <label>选择数据源</label>
                        <select id="analysis-datasource">
                            <option value="">请选择数据源...</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>分析问题</label>
                        <textarea id="analysis-query" placeholder="输入你的数据分析问题，例如：分析销售额的统计特征、检测异常值、对比不同地区的销售表现..."></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="executeAnalysis()">
                        <span>🚀</span> 开始智能分析
                    </button>
                </div>

                <div id="analysis-result" class="card" style="display:none">
                    <div class="card-header">
                        <h2><span class="icon">📊</span>分析结果</h2>
                    </div>
                    <div id="analysis-summary" class="summary-box"></div>

                    <div class="section-title">统计分析</div>
                    <div id="statistics-result"></div>

                    <div class="section-title">异常检测</div>
                    <div id="anomalies-result"></div>

                    <div class="section-title">分析报告</div>
                    <div class="report-content" id="report-content"></div>
                </div>
            </div>

            <!-- Reports Tab -->
            <div id="reports-tab" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h2><span class="icon">📚</span>报告列表</h2>
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>查询问题</th>
                                <th>数据源</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="reports-body">
                            <tr><td colspan="6" class="empty-state"><div class="empty-icon">📭</div>暂无报告</td></tr>
                        </tbody>
                    </table>
                </div>

                <div id="report-detail" class="card" style="display:none">
                    <div class="card-header">
                        <h2><span class="icon">📄</span>报告详情</h2>
                    </div>
                    <div class="report-content" id="report-detail-content"></div>
                </div>
            </div>

            <!-- Logs Tab -->
            <div id="logs-tab" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h2><span class="icon">🔎</span>执行日志查询</h2>
                    </div>
                    <div class="input-group" style="display:flex;gap:12px;align-items:flex-end;">
                        <div style="flex:1;">
                            <label>分析记录ID</label>
                            <input type="number" id="log-analysis-id" placeholder="输入分析ID">
                        </div>
                        <button class="btn btn-primary" onclick="getAnalysisLog()">查询日志</button>
                    </div>
                    <div id="log-content" style="margin-top:20px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">📊 数据预览</h3>
                <button class="modal-close" onclick="closePreview()">×</button>
            </div>
            <div style="overflow-x:auto;">
                <table class="table">
                    <thead id="preview-thead"></thead>
                    <tbody id="preview-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
            document.getElementById(`${tab}-tab`).classList.add('active');
            document.querySelector(`.sidebar a[href="#${tab}"]`).classList.add('active');

            if (tab === 'data') loadDataSources();
            if (tab === 'analysis') loadAnalysisDataSources();
            if (tab === 'reports') loadReports();
        }

        async function loadDataSources() {
            try {
                const res = await fetch(`${API_BASE}/data/sources`);
                const data = await res.json();
                const tbody = document.getElementById('data-sources-body');
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="empty-icon">📭</div>暂无数据，请上传文件</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(ds => `
                    <tr>
                        <td><strong>${ds.name}</strong></td>
                        <td>${ds.filename}</td>
                        <td><span class="badge badge-info">${ds.columns.length} 字段</span></td>
                        <td>${ds.row_count.toLocaleString()} 行</td>
                        <td>${(ds.size_bytes / 1024).toFixed(1)} KB</td>
                        <td>
                            <button class="btn btn-secondary btn-sm" onclick="previewData(${ds.id})">预览</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteDataSource(${ds.id})">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('加载数据源失败:', e);
            }
        }

        async function previewData(id) {
            const res = await fetch(`${API_BASE}/data/sources/${id}/preview?sample_size=10`);
            const data = await res.json();
            const thead = document.getElementById('preview-thead');
            const tbody = document.getElementById('preview-tbody');
            thead.innerHTML = `<tr>${data.columns.map(c => `<th>${c}</th>`).join('')}</tr>`;
            tbody.innerHTML = data.rows.map(row => `<tr>${data.columns.map(c => `<td>${row[c] || ''}</td>`).join('')}</tr>`).join('');
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        async function deleteDataSource(id) {
            if (!confirm('确定删除该数据源？')) return;
            const res = await fetch(`${API_BASE}/data/sources/${id}`, { method: 'DELETE' });
            if (res.ok) loadDataSources();
        }

        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('upload-area').classList.add('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('upload-area').classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) uploadFile(files[0]);
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) uploadFile(file);
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch(`${API_BASE}/data/upload`, { method: 'POST', body: formData });
            const result = await res.json();
            const area = document.getElementById('upload-result');
            if (res.ok) {
                area.innerHTML = `<div class="badge badge-success">✓ ${result.message}</div>`;
                loadDataSources();
            } else {
                area.innerHTML = `<div class="badge badge-error">✗ ${result.detail}</div>`;
            }
            setTimeout(() => area.innerHTML = '', 4000);
        }

        async function loadAnalysisDataSources() {
            const res = await fetch(`${API_BASE}/data/sources`);
            const data = await res.json();
            const select = document.getElementById('analysis-datasource');
            select.innerHTML = '<option value="">请选择数据源...</option>' +
                data.map(ds => `<option value="${ds.id}">${ds.name} (${ds.filename})</option>`).join('');
        }

        async function executeAnalysis() {
            const dsId = document.getElementById('analysis-datasource').value;
            const query = document.getElementById('analysis-query').value;

            if (!dsId || !query.trim()) {
                alert('请选择数据源并输入分析问题');
                return;
            }

            const resultDiv = document.getElementById('analysis-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div class="card-header"><h2><span class="icon">📊</span>分析结果</h2></div>
                <div style="text-align:center;padding:60px;">
                    <div class="loading"></div>
                    <p style="margin-top:20px;color:var(--text-secondary);">正在分析中，请稍候...</p>
                </div>
            `;
            showTab('analysis');

            const res = await fetch(`${API_BASE}/analysis/execute`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data_source_id: parseInt(dsId), user_query: query })
            });

            const result = await res.json();

            if (res.ok) {
                resultDiv.innerHTML = `
                    <div class="card-header"><h2><span class="icon">📊</span>分析结果</h2></div>
                    <div class="summary-box">${result.summary}</div>

                    <div class="section-title">统计分析</div>
                    <div id="statistics-result">${renderStatistics(result.statistics)}</div>

                    <div class="section-title">异常检测</div>
                    <div id="anomalies-result">${renderAnomalies(result.anomalies)}</div>

                    <div class="section-title">分析报告</div>
                    <div class="report-content" id="report-content">${result.report_content}</div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="card-header"><h2><span class="icon">❌</span>分析失败</h2></div>
                    <div class="badge badge-error">${result.detail}</div>
                `;
            }
        }

        function renderStatistics(stats) {
            if (!stats) return '<p class="empty-state"><div class="empty-icon">📊</div>暂无统计数据</p>';
            return Object.entries(stats).map(([field, data]) => `
                <div class="card" style="margin-bottom:12px;">
                    <h3 style="font-size:14px;margin-bottom:12px;">📈 ${field}</h3>
                    <div class="stats-grid">
                        <div class="stat-item"><div class="stat-label">均值</div><div class="stat-value">${data.mean?.toFixed(2) || 'N/A'}</div></div>
                        <div class="stat-item"><div class="stat-label">中位数</div><div class="stat-value">${data.median?.toFixed(2) || 'N/A'}</div></div>
                        <div class="stat-item"><div class="stat-label">标准差</div><div class="stat-value">${data.std?.toFixed(2) || 'N/A'}</div></div>
                        <div class="stat-item"><div class="stat-label">最大值</div><div class="stat-value">${data.max?.toFixed(2) || 'N/A'}</div></div>
                        <div class="stat-item"><div class="stat-label">最小值</div><div class="stat-value">${data.min?.toFixed(2) || 'N/A'}</div></div>
                        <div class="stat-item"><div class="stat-label">总和</div><div class="stat-value">${data.sum?.toFixed(2) || 'N/A'}</div></div>
                    </div>
                </div>
            `).join('');
        }

        function renderAnomalies(anomalies) {
            if (!anomalies || anomalies.length === 0) return '<p class="empty-state"><div class="empty-icon">✅</div>未检测到数据异常</p>';
            return anomalies.map(a => `
                <div class="anomaly-item ${a.severity}">
                    <div class="anomaly-header">
                        <span class="anomaly-title">${a.type}</span>
                        <span class="badge badge-${a.severity === 'high' ? 'error' : a.severity === 'medium' ? 'warning' : 'info'}">${a.severity}</span>
                    </div>
                    <div class="anomaly-desc">${a.description}</div>
                    <div class="anomaly-advice">💡 ${a.recommendation}</div>
                </div>
            `).join('');
        }

        async function loadReports() {
            const res = await fetch(`${API_BASE}/analysis/history`);
            const data = await res.json();
            const tbody = document.getElementById('reports-body');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="empty-icon">📭</div>暂无报告</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(r => `
                <tr>
                    <td><strong>#${r.id}</strong></td>
                    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.user_query}">${r.user_query}</td>
                    <td>数据源 #${r.data_source_id}</td>
                    <td><span class="badge ${r.status === 'completed' ? 'badge-success' : r.status === 'failed' ? 'badge-error' : 'badge-warning'}">${r.status}</span></td>
                    <td>${new Date(r.created_at).toLocaleString()}</td>
                    <td><button class="btn btn-secondary btn-sm" onclick="viewReport(${r.id})">查看</button></td>
                </tr>
            `).join('');
        }

        async function viewReport(id) {
            const res = await fetch(`${API_BASE}/analysis/${id}`);
            const data = await res.json();
            const detailDiv = document.getElementById('report-detail');
            detailDiv.style.display = 'block';
            document.getElementById('report-detail-content').innerHTML = data.report_content || '<p class="empty-state"><div class="empty-icon">📄</div>暂无报告内容</p>';
        }

        async function getAnalysisLog() {
            const id = document.getElementById('log-analysis-id').value;
            if (!id) return;

            const res = await fetch(`${API_BASE}/analysis/${id}`);
            const data = await res.json();
            const logDiv = document.getElementById('log-content');

            if (res.ok) {
                logDiv.innerHTML = `
                    <div class="card">
                        <h3 style="margin-bottom:16px;">📋 分析记录 #${id}</h3>
                        <p><strong>用户查询:</strong> ${data.user_query}</p>
                        <p><strong>状态:</strong> <span class="badge ${data.status === 'completed' ? 'badge-success' : 'badge-error'}">${data.status}</span></p>
                        <h4 style="margin-top:20px;margin-bottom:12px;">🔧 工具调用记录</h4>
                        <pre style="background:var(--bg-gray);padding:16px;border-radius:10px;max-height:400px;overflow:auto;font-size:12px;">${JSON.stringify(data.tool_calls || [], null, 2)}</pre>
                    </div>
                `;
            } else {
                logDiv.innerHTML = `<div class="badge badge-error">查询失败：${data.detail}</div>`;
            }
        }

        // Initialize
        showTab('data');
    </script>
</body>
</html>
